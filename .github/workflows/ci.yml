name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - name: Tests (helpers, job queue, mobile logic)
        run: npm test
      - name: Lint web app
        run: npm run lint --prefix client
      - name: Build web app
        run: npm run build --prefix client
      - name: End-to-end (live server, in-memory MongoDB)
        run: npm run test:e2e
