# /etc/nginx/sites-available/taskmanager - replace tm.example.com with your domain.
# certbot --nginx adds the HTTPS server block and the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name tm.example.com;

    # Attachments: up to 5 files of 15 MB per request.
    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live notifications (server-sent events): keep the connection open.
    location = /api/notifications/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
